<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>엘든링 고화질 맵</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }

        /* 줌/팬이 적용될 래퍼 영역 */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* 맵 전체를 감싸는 컨테이너 */
        .map-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 가로 2열 배치 */
            line-height: 0; /* 이미지 하단에 생기는 미세한 여백 제거 */
            position: absolute;
            transform-origin: 0 0;
            user-select: none;
        }

        /* 개별 이미지 조각 스타일 */
        .map-container img {
            width: 100%;
            height: auto;
            display: block;
            margin: -0.05px;
            padding: 0;
            pointer-events: none;
            transform: scale(1.0001);
        }

        /* 추가 레이어 이미지 공통 스타일 */
        .overlay-item {
            position: absolute;
            cursor: move;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }

        /* 개별 추가 이미지 초기 위치 지정 */
        #overlay1 {
            top: 100px;
            left: 100px;
            width: 150px;
        }

        #overlay2 {
            top: 100px;
            left: 300px;
            width: 150px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="map-container" id="mapContainer">
            <!-- 1행 (좌우) -->
            <img src="map_1.webp" alt="맵 조각 1">
            <img src="map_2.webp" alt="맵 조각 2">
            <!-- 2행 (좌우) -->
            <img src="map_3.webp" alt="맵 조각 3">
            <img src="map_4.webp" alt="맵 조각 4">
            <!-- 3행 (좌우) -->
            <img src="map_5.webp" alt="맵 조각 5">
            <img src="map_6.webp" alt="맵 조각 6">
            <!-- 4행 (좌우) -->
            <img src="map_7.webp" alt="맵 조각 7">
            <img src="map_8.webp" alt="맵 조각 8">

            <!-- 맵 위에 배치되어 좌표와 줌에 함께 반응하는 추가 이미지 3개 -->
            <img src="Dmap_1.png" alt="추가 이미지 1" class="overlay-item" id="overlay1">
            <img src="Dmap_2.png" alt="추가 이미지 2" class="overlay-item" id="overlay2">
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const container = document.getElementById('mapContainer');

        let scale = 1;
        let panning = false;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;

        function setTransform() {
            container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // 맵 전체 팬(드래그) 처리
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('overlay-item')) return; // 추가 이미지 드래그 시 맵 이동 방지
            panning = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mouseup', () => {
            panning = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!panning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        // 줌 처리
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            
            const delta = -e.deltaY;
            if (delta > 0) {
                scale *= 1.1;
            } else {
                scale /= 1.1;
            }

            scale = Math.max(0.5, Math.min(scale, 10));

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;

            setTransform();
        }, { passive: false });

        // 추가 이미지 개별 드래그 처리
        const overlayItems = document.querySelectorAll('.overlay-item');

        overlayItems.forEach(item => {
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let initialLeft = 0;
            let initialTop = 0;

            item.addEventListener('mousedown', (e) => {
                e.stopPropagation(); // 맵 팬 이벤트 전달 중지
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                initialLeft = item.offsetLeft;
                initialTop = item.offsetTop;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = (e.clientX - dragStartX) / scale; // 줌 배율을 반영한 이동 거리 계산
                const dy = (e.clientY - dragStartY) / scale;
                item.style.left = `${initialLeft + dx}px`;
                item.style.top = `${initialTop + dy}px`;
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });
        });
    </script>

</body>
</html>
